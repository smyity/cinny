name: Build and Push to Local Registry

on:
  push:
    branches: [ dev ]

jobs:
  build:
    # Имя должно СТРОГО совпадать с name релиза в helmfile (arc-runner-set)
    runs-on: arc-runner-set

    # Переменная, чтобы Docker-клиент внутри раннера видел контейнер dind
    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Docker to be ready
        run: |
          until docker info; do
            echo "Waiting for Docker..."
            sleep 1
          done

      - name: Build image
        run: |
          # Используем адрес сервиса внутри кластера или внешний ingress
          # В вашем helmfile это: registry.local
          docker build -t registry.local/my-app:${{ github.sha }} .
          docker tag registry.local/my-app:${{ github.sha }} registry.local/my-app:latest

      - name: Push to Local Registry
        run: |
          # Так как в dind прописан --insecure-registry, логин не обязателен (если не настраивали auth)
          docker push registry.local/my-app:${{ github.sha }}
          docker push registry.local/my-app:latest
