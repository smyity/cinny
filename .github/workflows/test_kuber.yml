name: Build and Push to VM Registry

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: my-runner-set
    steps:
      # Используем checkout (он работает через git, докер ему не нужен)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Kaniko Binary
        run: |
          # 1. Извлекаем бинарный файл из официального образа Kaniko
          # Мы используем временный контейнер только чтобы забрать файл
          echo "Extracting Kaniko executor from Docker image..."
          
          # Так как у нас нет докера внутри, мы скачаем архив образа и распакуем его
          # Но проще всего - использовать правильную прямую ссылку на бинарник:
          curl -sSL -o kaniko-executor https://github.com
          
          # 2. Проверяем, что это не HTML (должно быть ELF бинарник)
          file kaniko-executor || echo "Downloaded file type check"
          
          # 3. Даем права и запускаем
          chmod +x kaniko-executor
          
          ./kaniko-executor \
            --context "${{ github.workspace }}" \
            --dockerfile "${{ github.workspace }}/Dockerfile" \
            --destination "51.250.79.226:5000/my-app:${{ github.sha }}" \
            --insecure \
            --skip-tls-verify \
            --cache=false