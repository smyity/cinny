name: Build and Push to VM Registry

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: my-runner-set
    steps:
      # Используем checkout (он работает через git, докер ему не нужен)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Kaniko Binary
        run: |
          # 1. Скачиваем бинарный файл Kaniko напрямую
          echo "Downloading Kaniko executor..."
          curl -sSL -o kaniko-executor https://github.com
          
          # 2. Даем права на выполнение
          chmod +x kaniko-executor
          
          # 3. Запускаем сборку
          # Kaniko по умолчанию ищет конфиг в /kaniko/.docker/config.json, 
          # но так как мы запускаем его как бинарник, укажем параметры явно.
          ./kaniko-executor \
            --context "${{ github.workspace }}" \
            --dockerfile "${{ github.workspace }}/Dockerfile" \
            --destination "51.250.79.226:5000/my-app:${{ github.sha }}" \
            --insecure \
            --skip-tls-verify \
            --cache=false