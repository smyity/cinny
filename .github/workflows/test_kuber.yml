name: Build and Push to VM Registry

on:
  push:
    branches: [ dev ]  # Запуск при пуше в main
  workflow_dispatch:      # Возможность запустить вручную кнопкой

jobs:
  build-and-push:
    # Имя должно СТРОГО совпадать с названием вашего Helm-релиза
    runs-on: my-runner-set 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push with Kaniko
        uses: gcr.io/kaniko-project/executor:latest
        with:
          args: >-
            --context=${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --destination=51.250.79.226:5000/my-app:${{ github.sha }}
            --insecure
            --skip-tls-verify