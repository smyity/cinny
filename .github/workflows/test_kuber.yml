name: Build and Push to Local Registry

on:
  push:
    branches: [ dev ]

jobs:
  build:
    # Имя должно СТРОГО совпадать с name релиза в helmfile (arc-runner-set)
    runs-on: arc-runner-set

    # Переменная, чтобы Docker-клиент внутри раннера видел контейнер dind
    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Docker to be ready
        run: |
          until docker info; do
            echo "Waiting for Docker..."
            sleep 1
          done

      - name: Build image
        run: |
          # 1. Собираем базовый образ
          docker build -t my-app-local .
          
          # 2. Создаем три "ярлыка" (тега) для проверки
          # Имя через hostAliases
          docker tag my-app-local registry.local:5000/my-app:${{ github.sha }}
          
          # Официальное имя Kubernetes DNS
          docker tag my-app-local registry-service.arc-systems.svc.cluster.local:5000/my-app:${{ github.sha }}
          
          # Прямой ClusterIP
          docker tag my-app-local 10.108.206.244:5000/my-app:${{ github.sha }}

      - name: Push and Test all names
        run: |
          echo "--- Testing Registry DNS Name ---"
          docker push registry-service.arc-systems.svc.cluster.local:5000/my-app:${{ github.sha }}
          
          echo "--- Testing hostAliases Name (registry.local) ---"
          docker push registry.local:5000/my-app:${{ github.sha }}
          
          echo "--- Testing Direct ClusterIP ---"
          docker push 10.108.206.244:5000/my-app:${{ github.sha }}