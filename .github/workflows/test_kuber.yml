name: Build and Push to Local Registry

on:
  push:
    branches: [ dev ]

jobs:
  build:
    # Имя должно СТРОГО совпадать с name релиза в helmfile (arc-runner-set)
    runs-on: arc-runner-set

    # Переменная, чтобы Docker-клиент внутри раннера видел контейнер dind
    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Build image
        run: |
          # 1. Проверяем, где мы и что тут лежит
          pwd
          ls -la
          
          # 2. Собираем (убедитесь, что Dockerfile в корне)
          docker build -t registry-service.arc-systems.svc.cluster.local:5000/my-app:${{ github.sha }} .