name: Build and Push to VM Registry

on:
  push:
    branches: [ dev ]  # Запуск при пуше в main
  workflow_dispatch:      # Возможность запустить вручную кнопкой

jobs:
  build-and-push:
    # Имя должно СТРОГО совпадать с названием вашего Helm-релиза
    runs-on: my-runner-set 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push to Local Registry
        run: |
          # 51.250.79.226:5000 — адрес вашего реестра на мастере
          IMAGE_NAME="51.250.79.226:5000/my-app:${{ github.sha }}"
          
          echo "Building $IMAGE_NAME..."
          docker build -t $IMAGE_NAME .
          
          echo "Pushing to registry..."
          docker push $IMAGE_NAME

      - name: Verify Catalog
        run: |
          # Проверим, что образ появился в списке
          curl http://51.250.79.226
