name: Build Cinny on Master
on:
  push:
    branches: [ dev ]

jobs:
  build-and-run:
    runs-on: [ master-of-cluster ] 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          # Сборка образа с тегом cinny:custom и пониженным приоритетом, чтобы ВМ была доступна
          # Можно так же ограничить память: docker build --memory="2g" -t cinny:custom .
          nice -n 19 docker build -t cinny:custom .

