name: Build and Push to VM Registry

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: my-runner-set 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Скачиваем исполнитель Kaniko напрямую в раннер
      - name: Build and Push with Kaniko
        run: |
          # Используем готовый экшен-обертку, который не требует docker-демона
          # Или запускаем через официальный образ напрямую, но БЕЗ ключевого слова container:
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            gcr.io/kaniko-project/executor:latest \
            --context /workspace \
            --dockerfile /workspace/Dockerfile \
            --destination 51.250.79.226:5000/my-app:${{ github.sha }} \
            --insecure \
            --skip-tls-verify