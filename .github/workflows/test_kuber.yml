name: Build and Push to Local Registry

on:
  push:
    branches: [ dev ]

jobs:
  build:
    # Имя должно СТРОГО совпадать с name релиза в helmfile (arc-runner-set)
    runs-on: arc-runner-set

    # Переменная, чтобы Docker-клиент внутри раннера видел контейнер dind
    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Docker to be ready
        run: |
          until docker info; do
            echo "Waiting for Docker..."
            sleep 1
          done

      - name: Build and push image
        run: |
          # Используем только надежное DNS-имя
          IMAGE_NAME="registry-service.arc-systems.svc.cluster.local:5000/my-app:${{ github.sha }}"
          
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME